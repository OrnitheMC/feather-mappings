name: Publish
on: [ workflow_dispatch ]
jobs:
  matrix_prep:
    uses: ./.github/workflows/matrix_prep.yml

  display_versions:
    needs: matrix_prep
    runs-on: ubuntu-24.04
    steps:
      - name: display versions
        run: echo '${{ needs.matrix_prep.outputs.versions }}' | jq '.include[].version_range[]'

  publish:
    needs: matrix_prep
    runs-on: ubuntu-24.04

    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix_prep.outputs.versions) }}

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: wrapper validation
        uses: gradle/actions/wrapper-validation@v4

      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: run publish script
        run: python3 publish.py
        env:
          MC_VERSIONS: ${{ join(matrix.version_range, ',') }}
          MAVEN_URL: ${{ secrets.NEW_MAVEN_URL }}
          MAVEN_USERNAME: ${{ secrets.NEW_MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEW_MAVEN_PASSWORD }}

  update_builds_cache:
    needs: publish
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: update builds cache
        run: ./gradlew updateNamedMappingsBuildsCache

      - name: commit builds cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add named-mappings-builds.json
          git diff --cached --quiet || git commit -m 'bump build numbers'
          git push
